<!DOCTYPE html>
<!-- Tells the browser this is an HTML5 document -->

<html lang="en">
<!-- Root element of the webpage -->

<head>

    <meta charset="UTF-8">
    <!-- Allows special characters like emojis (🩺) -->

    <title>AI Healthcare Chatbot</title>
    <!-- Text shown on the browser tab -->

    <style>

        /* Applies to every element */
        *{
            margin:0;
            padding:0;
            box-sizing:border-box;
            font-family:Arial, Helvetica, sans-serif;
        }

        /* Styles the whole webpage */
        body{
            background:linear-gradient(135deg,#74ebd5,#9face6);
            height:100vh;
            display:flex;
            justify-content:center;
            align-items:center;
        }

        /* Main white card */
        .container{

            width:700px;
            background:white;
            padding:35px;
            border-radius:15px;
            box-shadow:0px 10px 25px rgba(0,0,0,0.2);

        }

        /* Main heading */
        h1{

            text-align:center;
            color:#0d6efd;
            margin-bottom:10px;

        }

        /* Paragraph below heading */
        p{

            text-align:center;
            color:gray;
            margin-bottom:25px;

        }

        /* Text area where user types question */
        textarea{

            width:100%;
            padding:15px;
            border-radius:10px;
            border:1px solid #ccc;
            font-size:16px;
            resize:none;

        }

        /* Changes border when user clicks textarea */
        textarea:focus{

            outline:none;
            border:2px solid #0d6efd;

        }

        /* Ask button */
        button{

            width:100%;
            margin-top:20px;
            padding:15px;
            border:none;
            background:#0d6efd;
            color:white;
            font-size:18px;
            border-radius:10px;
            cursor:pointer;

        }

        /* Button hover effect */
        button:hover{

            background:#0b5ed7;

        }

        /* AI response box */
        .answer{

            margin-top:30px;
            padding:20px;
            background:#f5f7fa;
            border-left:6px solid #0d6efd;
            border-radius:10px;

        }

        /* AI response heading */
        .answer h3{

            margin-bottom:10px;
            color:#0d6efd;

        }

    </style>

</head>

<body>

<!-- White card starts -->
<div class="container">

    <!-- Main title -->
    <h1>🩺 AI Healthcare Chatbot</h1>

    <!-- Small description -->
    <p>Ask any general health-related question.</p>

    <!-- Form sends data to Flask -->
    <form method="POST">

        <!-- User types health question -->
        <textarea
            name="question"
            rows="6"
            placeholder="Example: I have a sore throat and mild fever. What should I do?"
            required></textarea>

        <!-- Submit button -->
        <button type="submit">Ask AI</button>

    </form>

    <!-- Flask displays this section only if answer exists -->
    {% if answer %}

    <div class="answer">

        <h3>🤖 AI Response</h3>

        <!-- AI answer from Flask -->
        <p>{{ answer }}</p>

    </div>

    {% endif %}

</div>

</body>

</html>
